# Оркестратор релизов PizzaShop.
# Запускается только по тегу vX.Y.Z в этом репо (ставится на HEAD ветки main) —
# значит "зафиксировать текущий main всех сервисов + фронтенда как релиз".
# Порядок промоушена веток: dev -> staging -> main (GitLab Flow, environment
# branches). Релиз возможен только после того, как staging смёржен в main —
# тег ставится уже поверх этого мёржа.
#
# Порядок: generate-image-tag -> tag-service-repos -> create-release ->
# trigger-*-service (сборка строго по только что созданному тегу) -> deploy-dev ->
# deploy-staging -> e2e/dast -> deploy-prod (заглушка, manual).
#
# Теги: vX.Y.Z — релиз (запускает этот пайплайн), tpl-vX.Y.Z — версии CI/CD
# шаблонов для include: в сервисных .gitlab-ci.yml, релиз не триггерят.

include:
  - local: '/templates/common/.send-notification-template.gitlab-ci.yml'
  - local: '/variables/.job-vars.gitlab-ci.yml'

# Пайплайн стартует только по тегу vX.Y.Z — условие вынесено сюда одним местом,
# джобы ниже свои rules: под это не дублируют. Ручные гейты (deploy-prod,
# rollback-*) — обычный when: manual без rules:.
workflow:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'

stages:
  - .pre               # тег образа, тегирование сервисных репо, GitLab Release
  - build               # сборка всех сервисов + фронтенда по тегу
  - deploy               # deploy-dev -> deploy-staging; e2e-smoke-dev тоже тут (needs: deploy-dev)
  - post-deploy-tests   # полный Playwright-прогон против staging
  - dast                 # ZAP по staging после деплоя
  - deploy-prod           # заглушка, manual, после dast/e2e
  - rollback               # ручной откат релизов


variables:
  HELM_REPO: "cluster-application/helm"
  E2E_TESTS_REPO: "cluster-application/e2e-tests"
  # Ветка сервисных репозиториев, от которой ставится релизный тег
  SOURCE_BRANCH_FOR_RELEASE: "main"
  # Путь репозитория фронтенда — отличается от backend-сервисов
  # (app/frontend/web, а не app/backend/${svc})
  FRONTEND_PROJECT_PATH: "cluster-application/app/frontend/web"
  # Единый источник правды для списка бэкенд-сервисов — используют и
  # tag-service-repos (тегирование репо), и create-release (таблица
  # коммитов в release notes). Добавил сервис — правишь только тут.
  BACKEND_SERVICES: "api-gateway catalog-service kitchen-service inventory-service order-service payment-service notification-service auth-service user-service delivery-service"


# --- .pre: генерация тега образа ---
generate-image-tag:
  stage: .pre
  image: ${INFRA_REGISTRY}/infra/alpine:3.24.2
  tags:
    - tests
  script:
    - |
      echo "🏷️  === Генерация тега Docker-образа ==="
      echo "CI_COMMIT_TAG: ${CI_COMMIT_TAG}"
      echo "CI_COMMIT_SHORT_SHA: ${CI_COMMIT_SHORT_SHA}"
      FINAL_TAG="${CI_COMMIT_TAG}-${CI_COMMIT_SHORT_SHA}"
      echo "📦 Final image tag: ${FINAL_TAG}"
      echo "UNIFIED_IMAGE_TAG=${FINAL_TAG}" > build.env
  artifacts:
    reports:
      dotenv: build.env
    expire_in: 1 day


# --- .pre: тегирование сервисных репозиториев ---
# Тегирует main каждого из 9 сервисов + фронтенда тегом ${CI_COMMIT_TAG} —
# фиксирует точный набор коммитов релиза. Идемпотентно: повторный запуск
# с уже существующим тегом не падает, а переиспользует его.
# Фронтенд тегируется отдельно после цикла — его путь в GitLab (app/frontend/web)
# не совпадает с паттерном app/backend/${svc}, по которому строятся пути сервисов.
tag-service-repos:
  stage: .pre
  image: ${INFRA_REGISTRY}/infra/alpine:3.24.2
  tags:
    - tests
  variables:
    GIT_STRATEGY: none
  before_script:
    - apk add --no-cache curl jq
  script:
    - |
      set -e
      SERVICES="${BACKEND_SERVICES}"
      FAILED=0
      > service-shas.env

      tag_repo() {
        # $1 = PROJECT_PATH (полный путь в GitLab, напр. cluster-application/app/backend/api-gateway)
        # $2 = VAR_NAME (имя переменной для service-shas.env, напр. API_GATEWAY_SHA)
        # $3 = человекочитаемое имя для логов
        local PROJECT_PATH="$1"
        local VAR_NAME="$2"
        local LABEL="$3"
        local ENCODED_PATH
        ENCODED_PATH=$(printf '%s' "${PROJECT_PATH}" | jq -sRr @uri)

        echo "🏷️  Tagging ${LABEL} -> ${CI_COMMIT_TAG} (ref: ${SOURCE_BRANCH_FOR_RELEASE})"

        HTTP_CODE=$(curl -s -o /tmp/resp.json -w "%{http_code}" \
          --request POST \
          --header "PRIVATE-TOKEN: ${RELEASE_API_TOKEN}" \
          "https://${PUBLIC_DOMAIN}/api/v4/projects/${ENCODED_PATH}/repository/tags?tag_name=${CI_COMMIT_TAG}&ref=${SOURCE_BRANCH_FOR_RELEASE}")

        if [ "${HTTP_CODE}" = "201" ]; then
          SHA=$(jq -r '.commit.short_id' /tmp/resp.json)
          echo "✅ ${LABEL}: тег создан на коммите ${SHA}"

        elif [ "${HTTP_CODE}" = "400" ] && grep -qi "already exists" /tmp/resp.json; then
          echo "⚠️  ${LABEL}: тег ${CI_COMMIT_TAG} уже существует, переиспользуем"
          HTTP_CODE2=$(curl -s -o /tmp/resp2.json -w "%{http_code}" \
            --header "PRIVATE-TOKEN: ${RELEASE_API_TOKEN}" \
            "https://${PUBLIC_DOMAIN}/api/v4/projects/${ENCODED_PATH}/repository/tags/${CI_COMMIT_TAG}")
          if [ "${HTTP_CODE2}" = "200" ]; then
            SHA=$(jq -r '.commit.short_id' /tmp/resp2.json)
          else
            SHA="unknown"
          fi

        else
          echo "❌ ${LABEL}: не удалось создать тег (HTTP ${HTTP_CODE})"
          cat /tmp/resp.json
          FAILED=1
          SHA="FAILED"
        fi

        echo "${VAR_NAME}_SHA=${SHA}" >> service-shas.env
      }

      # --- Бэкенд-сервисы (app/backend/${svc}) ---
      for svc in $SERVICES; do
        PROJECT_PATH="cluster-application/app/backend/${svc}"
        VAR_NAME=$(echo "${svc}" | tr '[:lower:]' '[:upper:]' | tr '-' '_')
        tag_repo "${PROJECT_PATH}" "${VAR_NAME}" "${svc}"
      done

      # --- Фронтенд (app/frontend/web) ---
      tag_repo "${FRONTEND_PROJECT_PATH}" "FRONTEND" "frontend"

      echo ""
      echo "=== Итоговые SHA сервисов в релизе ${CI_COMMIT_TAG} ==="
      cat service-shas.env

      if [ "${FAILED}" = "1" ]; then
        echo ""
        echo "❌ Один или несколько сервисов не удалось тегировать. Релиз остановлен."
        exit 1
      fi
  artifacts:
    reports:
      dotenv: service-shas.env
    expire_in: 30 days


# --- .pre: создание GitLab Release ---
# release: ключ интерполирует переменные до script — dotenv-переменные из needs
# (SHA'ы, UNIFIED_IMAGE_TAG) не всегда успевают подставиться, поэтому собираем
# description сами и зовём release-cli напрямую.
# Таблица коммитов строится по $BACKEND_SERVICES — добавил сервис туда,
# он сам появится в таблице, без правки этого job'а.
create-release:
  stage: .pre
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  tags:
    - tests
  needs:
    - job: generate-image-tag
      artifacts: true
    - job: tag-service-repos
      artifacts: true
  script:
    - |
      set -e
      echo "Создаём GitLab Release для ${CI_COMMIT_TAG}"

      TABLE_ROWS=""
      for svc in frontend ${BACKEND_SERVICES}; do
        VAR_NAME=$(echo "${svc}" | tr '[:lower:]' '[:upper:]' | tr '-' '_')
        SHA_VAR_NAME="${VAR_NAME}_SHA"
        eval "SHA_VALUE=\${${SHA_VAR_NAME}}"
        TABLE_ROWS="${TABLE_ROWS}| ${svc} | \`${SHA_VALUE}\` |
      "
      done

      cat > release-description.md << DESCEOF
      ## 🚀 PizzaShop Release ${CI_COMMIT_TAG}

      **Unified image tag:** \`${UNIFIED_IMAGE_TAG}\`
      **Собрано из ветки:** \`${SOURCE_BRANCH_FOR_RELEASE}\`

      ### Коммиты сервисов, вошедшие в релиз:
      | Сервис | Коммит |
      |---|---|
      ${TABLE_ROWS}
      Задеплоено на: dev → staging
      DESCEOF

      cat release-description.md

      release-cli create \
        --name "PizzaShop Release ${CI_COMMIT_TAG}" \
        --tag-name "${CI_COMMIT_TAG}" \
        --description "$(cat release-description.md)"


# --- уведомление: релиз создан ---
release-notify:
  extends: .template:send-notification
  stage: .pre
  needs:
    - job: generate-image-tag
    - job: create-release
  variables:
    NOTIFY_TEXT: "🚀 PizzaShop: релиз ${CI_COMMIT_TAG} создан, деплой на dev/staging запущен.\n${CI_PIPELINE_URL}"


# --- build: триггеры сборки микросервисов и фронтенда ---
# branch: $CI_COMMIT_TAG — собираем строго тег, который только что поставили
# в tag-service-repos, а не текущий staging.

trigger-frontend:
  stage: build
  variables:
    UNIFIED_IMAGE_TAG: "${UNIFIED_IMAGE_TAG}"
  trigger:
    project: cluster-application/app/frontend/web
    branch: "$CI_COMMIT_TAG"
    strategy: depend
    forward:
      yaml_variables: true
  needs:
    - job: generate-image-tag
    - job: tag-service-repos

trigger-api-gateway:
  stage: build
  variables:
    UNIFIED_IMAGE_TAG: "${UNIFIED_IMAGE_TAG}"
  trigger:
    project: cluster-application/app/backend/api-gateway
