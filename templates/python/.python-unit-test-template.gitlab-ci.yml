# Юнит-тесты (pytest) + покрытие для Python-сервисов. Код уже зачекаучен
# раннером, отдельно клонировать репо не нужно. Порог — 30%.
.template:python-unit-test:
  stage: unit-test
  image: ${INFRA_REGISTRY}/lang/python:3.12-slim
  tags:
    - tests
  before_script:
    - pip install -r requirements.txt
    - pip install pytest pytest-cov pytest-mock
  script:
    - |
      pytest tests/ -v --cov=app --cov-report=term-missing --cov-report=xml --cov-report=json
      COVERAGE_UNIT=$(python3 -c "import json; data = json.load(open('coverage.json')); print(f\"{data['totals']['percent_covered']:.2f}\")")
      echo "Total coverage: ${COVERAGE_UNIT}%"
      echo "COVERAGE_UNIT=${COVERAGE_UNIT}" > coverage.env
    - |
      MIN_COVERAGE_UNIT=30
      if (( $(echo "$COVERAGE_UNIT < $MIN_COVERAGE_UNIT" | bc -l) )); then
        echo "❌ Coverage ${COVERAGE_UNIT}% is below ${MIN_COVERAGE_UNIT}%"
        exit 1
      else
        echo "✅ Coverage ${COVERAGE_UNIT}% is OK"
      fi
  artifacts:
    when: always
    paths:
      - coverage.xml
      - coverage.json
      - coverage.env
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
      dotenv: coverage.env
    expire_in: 1 week
  coverage: '/TOTAL.*\s+(\d+%)$/'
