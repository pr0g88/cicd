# Ищем секреты (ключи, пароли, токены) в коде через gitleaks. Блокирующий —
# если что-то нашёл, лучше сразу разобраться и перевыпустить секрет,
# чем тащить его дальше по пайплайну.
.template:secret-scan:
  stage: secret-scan
  image:
    name: ${INFRA_REGISTRY}/security/gitleaks:v8.30.1
    entrypoint: [""]
  tags:
    - tests
  script:
    - gitleaks detect --source . --report-path /tmp/gitleaks-results.json --report-format json --verbose || true
    - |
      if [ -f /tmp/gitleaks-results.json ] && [ "$(cat /tmp/gitleaks-results.json)" != "[]" ]; then
        cp /tmp/gitleaks-results.json ${CI_PROJECT_DIR}/gitleaks-results.json
        echo "❌ Gitleaks found potential secrets"
        cat /tmp/gitleaks-results.json
        exit 1
      else
        echo "✅ No secrets found"
        echo '{"results":[]}' > ${CI_PROJECT_DIR}/gitleaks-results.json
      fi
  artifacts:
    when: always
    paths:
      - gitleaks-results.json
    expire_in: 1 week
