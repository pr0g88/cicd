# Короткие уведомления пайплайна в Telegram через свой relay-сервис (не бьём
# в Bot API напрямую — relay сам ретранслирует сообщение через бота).
#
#   POST <TG_NOTIFY_URL>   headers: X-API-Key, Idempotency-Key
#   body: {"text": "...", "chat_id": "..."}   (chat_id опционален)
#
# Нужны protected CI/CD переменные проекта/группы:
#   TG_NOTIFY_URL, TG_NOTIFY_API_KEY, TG_NOTIFY_CA_CERT (File, серт самоподписанный),
#   TG_NOTIFY_CHAT_ID (опционально — иначе релей шлёт в свой дефолтный чат)
#
# NOTIFY_TEXT задаётся в каждом job'е через extends: .template:send-notification.
# curl ретраит до 10 раз — маршрут раннер -> relay периодически рвётся на сети.
# Idempotency-Key = "${CI_JOB_NAME}-${CI_PIPELINE_ID}", чтобы ручной Retry в GitLab UI
# не задублировал сообщение.
#
# allow_failure: true — не отправилось уведомление, пайплайн всё равно живой.
.template:send-notification:
  image: ${INFRA_REGISTRY}/infra/alpine:3.24.2
  tags:
    - tests
  allow_failure: true
  variables:
    NOTIFY_TEXT: ""
  before_script:
    - apk add --no-cache curl jq
  script:
    - |
      if [ -z "$NOTIFY_TEXT" ]; then
        echo "⚠️  NOTIFY_TEXT не задан — уведомление не отправлено"
        exit 0
      fi
      if [ -z "$TG_NOTIFY_URL" ] || [ -z "$TG_NOTIFY_API_KEY" ]; then
        echo "⚠️  TG_NOTIFY_URL / TG_NOTIFY_API_KEY не заданы (Settings → CI/CD → Variables) — уведомление не отправлено"
        exit 0
      fi

      CACERT_ARGS=""
      if [ -n "$TG_NOTIFY_CA_CERT" ] && [ -f "$TG_NOTIFY_CA_CERT" ]; then
        CACERT_ARGS="--cacert ${TG_NOTIFY_CA_CERT}"
      else
        echo "⚠️  TG_NOTIFY_CA_CERT не задан (File-переменная с fullchain.pem) — сертификат сервиса самоподписанный, TLS проверить будет нечем"
      fi

      if [ -n "$TG_NOTIFY_CHAT_ID" ]; then
        PAYLOAD=$(jq -n --arg text "$NOTIFY_TEXT" --arg chat_id "$TG_NOTIFY_CHAT_ID" '{text: $text, chat_id: $chat_id}')
      else
        PAYLOAD=$(jq -n --arg text "$NOTIFY_TEXT" '{text: $text}')
      fi

      if [ -n "$CI_JOB_NAME" ] && [ -n "$CI_PIPELINE_ID" ]; then
        IDEMPOTENCY_KEY="${CI_JOB_NAME}-${CI_PIPELINE_ID}"
      else
        IDEMPOTENCY_KEY=$(cat /proc/sys/kernel/random/uuid 2>/dev/null)
        if [ -z "$IDEMPOTENCY_KEY" ]; then
          IDEMPOTENCY_KEY="$(date +%s)-$$-$(head -c4 /dev/urandom | od -An -tx1 | tr -d ' \n')"
        fi
      fi

      HTTP_CODE=$(curl -sS -o /tmp/notify-response.json -w "%{http_code}" \
        --max-time 20 \
        --retry 10 --retry-delay 3 --retry-all-errors \
        -X POST "${TG_NOTIFY_URL}" \
        -H "Content-Type: application/json" \
        -H "X-API-Key: ${TG_NOTIFY_API_KEY}" \
        -H "Idempotency-Key: ${IDEMPOTENCY_KEY}" \
        ${CACERT_ARGS} \
        -d "${PAYLOAD}")

      if [ "${HTTP_CODE}" = "200" ]; then
        echo "✅ уведомление отправлено (Idempotency-Key: ${IDEMPOTENCY_KEY})"
        cat /tmp/notify-response.json
      else
        echo "❌ ошибка отправки уведомления (HTTP ${HTTP_CODE}, Idempotency-Key: ${IDEMPOTENCY_KEY}):"
        cat /tmp/notify-response.json
        exit 1
      fi
